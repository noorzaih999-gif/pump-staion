<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منوی ما</title>
<meta name="description" content="منوی دیجیتال - با اسکن کد QR مشاهده کنید">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap');

/* ============ پالت رنگ چوبی و نرم ============ */
:root{
  --wood-dark:#3b2417;
  --wood:#5c3a21;
  --wood-light:#8b5e34;
  --cream:#f6ead8;
  --cream-soft:#fbf4e8;
  --gold:#c89b5a;
  --gold-bright:#e0b878;
  --leaf:#7a8b4f;
  --rose:#c98a7a;
  --txt:#3a2a1c;
  --txt-soft:#6b5544;
  --shadow:rgba(59,36,23,.25);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Vazirmatn',sans-serif;
  color:var(--txt);
  min-height:100vh;
  background:
    radial-gradient(circle at 20% 10%, rgba(200,155,90,.12), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(122,139,79,.12), transparent 40%),
    linear-gradient(135deg,#7a4f2d 0%,#5c3a21 25%,#462b18 50%,#5c3a21 75%,#6e4527 100%);
  background-attachment:fixed;
  overflow-x:hidden;
}
/* رگه‌های چوب */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:repeating-linear-gradient(
    90deg,
    rgba(0,0,0,.04) 0px,
    rgba(0,0,0,.04) 2px,
    transparent 2px,
    transparent 7px,
    rgba(255,255,255,.025) 7px,
    rgba(255,255,255,.025) 9px,
    transparent 9px,
    transparent 16px
  );
}

/* ============ ذرات شناور ============ */
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;bottom:-30px;border-radius:50%;
  background:radial-gradient(circle,rgba(224,184,120,.5),rgba(224,184,120,0));
  animation:floatUp linear infinite}
@keyframes floatUp{
  0%{transform:translateY(0) translateX(0) scale(.6);opacity:0}
  10%{opacity:.8}
  90%{opacity:.5}
  100%{transform:translateY(-105vh) translateX(40px) scale(1.1);opacity:0}
}

/* ============ هدر / هیرو ============ */
.hero{
  position:relative;z-index:2;text-align:center;
  padding:54px 20px 40px;
  animation:heroIn 1.1s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes heroIn{from{opacity:0;transform:translateY(-26px)}to{opacity:1;transform:translateY(0)}}
.logo-badge{
  width:96px;height:96px;margin:0 auto 18px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:2.6rem;
  background:linear-gradient(145deg,var(--gold-bright),var(--gold));
  box-shadow:0 10px 30px var(--shadow),inset 0 2px 6px rgba(255,255,255,.4);
  border:3px solid var(--cream-soft);
  animation:badgeFloat 4s ease-in-out infinite;
}
@keyframes badgeFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
.hero h1{
  font-size:2.3rem;font-weight:900;color:var(--cream);
  letter-spacing:1px;text-shadow:0 3px 10px rgba(0,0,0,.4);
  margin-bottom:8px;
}
.hero .tagline{
  color:var(--gold-bright);font-size:1rem;font-weight:500;
  letter-spacing:3px;text-shadow:0 2px 6px rgba(0,0,0,.35);
}
.hero .divider{
  width:120px;height:3px;margin:18px auto 0;border-radius:3px;
  background:linear-gradient(90deg,transparent,var(--gold-bright),transparent);
  position:relative;
}
.hero .divider::after{
  content:"❖";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:var(--gold-bright);font-size:1rem;background:transparent;
  text-shadow:0 0 8px var(--gold);
}

/* ============ ناوبری دسته‌ها (دکمه‌های انیمیشن‌دار) ============ */
.nav{
  position:sticky;top:0;z-index:50;
  display:flex;gap:10px;padding:14px 16px;overflow-x:auto;
  background:rgba(59,36,23,.78);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(224,184,120,.25);
  scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav-btn{
  position:relative;flex:0 0 auto;
  display:flex;align-items:center;gap:7px;
  padding:10px 18px;border:1.5px solid rgba(224,184,120,.4);
  border-radius:50px;cursor:pointer;white-space:nowrap;
  background:rgba(246,234,216,.08);color:var(--cream);
  font-family:'Vazirmatn',sans-serif;font-size:.9rem;font-weight:600;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),background .35s,color .35s,box-shadow .35s;
  overflow:hidden;
}
.nav-btn .ico{font-size:1.1rem;transition:transform .4s}
.nav-btn::before{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(135deg,var(--gold-bright),var(--gold));
  transform:scale(0);opacity:0;transition:transform .4s ease,opacity .4s;z-index:-1;
}
.nav-btn:hover{transform:translateY(-4px);box-shadow:0 8px 18px rgba(0,0,0,.3)}
.nav-btn:hover .ico{transform:rotate(-12deg) scale(1.25)}
.nav-btn:active{transform:scale(.94)}
.nav-btn.active{color:var(--wood-dark);border-color:transparent;font-weight:800}
.nav-btn.active::before{transform:scale(1);opacity:1}
.nav-btn.active .ico{transform:scale(1.15)}

/* ============ بدنه منو ============ */
.menu-wrap{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:26px 16px 120px}
.category{margin-bottom:42px;scroll-margin-top:80px}
.cat-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.cat-head .cat-ico{
  width:52px;height:52px;border-radius:16px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:1.6rem;
  background:linear-gradient(145deg,var(--gold-bright),var(--gold));
  box-shadow:0 6px 16px var(--shadow);
}
.cat-head h2{font-size:1.5rem;font-weight:800;color:var(--cream);text-shadow:0 2px 8px rgba(0,0,0,.35)}
.cat-head .line{flex:1;height:2px;border-radius:2px;
  background:linear-gradient(90deg,rgba(224,184,120,.6),transparent)}

/* کارت آیتم */
.item{
  display:flex;align-items:center;gap:14px;
  background:linear-gradient(145deg,var(--cream-soft),var(--cream));
  border:1px solid rgba(200,155,90,.35);
  border-radius:18px;padding:14px 16px;margin-bottom:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.18);
  position:relative;overflow:hidden;
  opacity:0;transform:translateY(26px);
  transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;
}
.item.show{animation:itemIn .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes itemIn{to{opacity:1;transform:translateY(0)}}
.item::after{
  content:"";position:absolute;top:0;left:-60%;width:50%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.5),transparent);
  transform:skewX(-20deg);transition:left .7s;
}
.item:hover{transform:translateY(-5px) scale(1.015);box-shadow:0 14px 30px rgba(0,0,0,.28)}
.item:hover::after{left:130%}
.item-emoji{
  width:56px;height:56px;flex:0 0 auto;border-radius:14px;
  display:flex;align-items:center;justify-content:center;font-size:1.9rem;
  background:linear-gradient(145deg,#fff,#f0e2cd);box-shadow:inset 0 0 0 1px rgba(200,155,90,.3);
  transition:transform .4s;
}
.item:hover .item-emoji{transform:rotate(8deg) scale(1.1)}
.item-info{flex:1;min-width:0}
.item-name{font-size:1.08rem;font-weight:700;color:var(--txt);margin-bottom:3px}
.item-desc{font-size:.82rem;color:var(--txt-soft);line-height:1.5}
.item-price{
  flex:0 0 auto;text-align:left;font-weight:800;color:var(--wood);
  font-size:1.05rem;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;
}
.item-price .num{
  background:linear-gradient(145deg,var(--gold-bright),var(--gold));
  color:var(--wood-dark);padding:6px 12px;border-radius:50px;
  box-shadow:0 3px 8px var(--shadow);font-size:1rem;
}
.item-price .unit{font-size:.66rem;color:var(--txt-soft);margin-top:4px;font-weight:500}
.tag{
  position:absolute;top:0;right:18px;transform:translateY(-50%);
  font-size:.66rem;font-weight:800;padding:3px 10px;border-radius:50px;color:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.25);
}
.tag.new{background:linear-gradient(135deg,#7a8b4f,#9bb05f)}
.tag.hot{background:linear-gradient(135deg,#c0563d,#e07a5f)}
.tag.special{background:linear-gradient(135deg,#a85f8c,#c98ab0)}

/* ============ دکمه شناور QR ============ */
.qr-fab{
  position:fixed;bottom:24px;left:24px;z-index:60;
  width:62px;height:62px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(145deg,var(--gold-bright),var(--gold));
  color:var(--wood-dark);font-size:1.6rem;
  box-shadow:0 8px 22px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;
  transition:transform .35s cubic-bezier(.2,.8,.2,1);
  animation:fabPulse 2.6s ease-in-out infinite;
}
@keyframes fabPulse{0%,100%{box-shadow:0 8px 22px rgba(0,0,0,.35),0 0 0 0 rgba(224,184,120,.5)}
  50%{box-shadow:0 8px 22px rgba(0,0,0,.35),0 0 0 14px rgba(224,184,120,0)}}
.qr-fab:hover{transform:scale(1.12) rotate(8deg)}
.qr-fab:active{transform:scale(.92)}

/* مودال QR */
.modal{
  position:fixed;inset:0;z-index:200;display:none;
  align-items:center;justify-content:center;padding:20px;
  background:rgba(30,18,10,.7);backdrop-filter:blur(6px);
}
.modal.open{display:flex;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{
  background:linear-gradient(145deg,var(--cream-soft),var(--cream));
  border:2px solid var(--gold);border-radius:24px;
  padding:28px 26px;max-width:340px;width:100%;text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.4);
  animation:popIn .45s cubic-bezier(.2,1.2,.3,1) both;
}
@keyframes popIn{from{opacity:0;transform:scale(.8) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-box h3{color:var(--wood);font-size:1.2rem;margin-bottom:6px}
.modal-box p{color:var(--txt-soft);font-size:.84rem;margin-bottom:18px}
#qrcode{display:inline-block;padding:14px;background:#fff;border-radius:16px;box-shadow:0 6px 16px var(--shadow)}
#qrcode img,#qrcode canvas{display:block;border-radius:6px}
.modal-url{margin-top:16px;font-size:.74rem;color:var(--txt-soft);word-break:break-all;
  background:rgba(200,155,90,.12);padding:8px 10px;border-radius:10px}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions button{
  flex:1;padding:11px;border-radius:12px;border:none;cursor:pointer;
  font-family:'Vazirmatn',sans-serif;font-weight:700;font-size:.86rem;transition:transform .2s,opacity .2s;
}
.btn-copy{background:var(--leaf);color:#fff}
.btn-close{background:rgba(59,36,23,.12);color:var(--wood)}
.modal-actions button:hover{transform:translateY(-2px);opacity:.92}

/* ============ فوتر ============ */
.footer{
  position:relative;z-index:2;text-align:center;padding:30px 20px 40px;
  color:var(--gold-bright);
}
.footer .shop{font-size:1.1rem;font-weight:800;color:var(--cream);margin-bottom:6px}
.footer .info{font-size:.82rem;color:rgba(246,234,216,.7);line-height:1.9}
.footer a{color:var(--gold-bright);text-decoration:none}

@media(max-width:480px){
  .hero h1{font-size:1.9rem}
  .item-emoji{width:48px;height:48px;font-size:1.6rem}
  .item-name{font-size:1rem}
  .cat-head h2{font-size:1.3rem}
}
</style>
</head>
<body>

<!-- ذرات شناور -->
<div class="particles" id="particles"></div>

<!-- هیرو -->
<header class="hero">
  <div class="logo-badge">☕</div>
  <h1 id="shopName">کافه چوب و آتش</h1>
  <div class="tagline">منوی دیجیتال</div>
  <div class="divider"></div>
</header>

<!-- ناوبری دسته‌ها -->
<nav class="nav" id="nav"></nav>

<!-- منو -->
<main class="menu-wrap" id="menu"></main>

<!-- دکمه شناور QR -->
<button class="qr-fab" id="qrFab" title="کد QR منو" aria-label="نمایش کد QR">⊞</button>

<!-- مودال QR -->
<div class="modal" id="qrModal">
  <div class="modal-box">
    <h3>کد QR منو</h3>
    <p>این کد را چاپ کنید تا مشتری‌ها با اسکن آن منو را ببینند</p>
    <div id="qrcode"></div>
    <div class="modal-url" id="qrUrl"></div>
    <div class="modal-actions">
      <button class="btn-copy" id="btnCopy">کپی لینک</button>
      <button class="btn-close" id="btnClose">بستن</button>
    </div>
  </div>
</div>

<!-- فوتر -->
<footer class="footer">
  <div class="shop">کافه چوب و آتش</div>
  <div class="info">
    🕐 همه روزه ۹ صبح تا ۱۲ شب<br>
    📞 ۰۹۱۲ ۰۰۰ ۰۰۰۰ &nbsp;|&nbsp; 📍 آدرس شما اینجا
  </div>
</footer>

<script>
/* ============================================================
   داده‌های منو — به‌راحتی ویرایش کنید
   هر دسته: title (عنوان)، icon (آیکن)، items (آیتم‌ها)
   هر آیتم: name، desc (توضیح)، price (قیمت)، emoji، tag اختیاری (new/hot/special)
   ============================================================ */
const MENU = [
  {
    id:"hot", title:"نوشیدنی گرم", icon:"☕",
    items:[
      {name:"اسپرسو", desc:"شات دوبل قهوه تازه دم", price:"۴۵٬۰۰۰", emoji:"☕", tag:"hot"},
      {name:"کاپوچینو", desc:"اسپرسو با شیر و فوم لطیف", price:"۶۵٬۰۰۰", emoji:"🥛"},
      {name:"لاته", desc:"قهوه با شیر بخارپز", price:"۷۰٬۰۰۰", emoji:"🍮"},
      {name:"موکا", desc:"ترکیب قهوه و شکلات داغ", price:"۷۵٬۰۰۰", emoji:"🍫", tag:"special"},
      {name:"چای ماسالا", desc:"چای هندی با ادویه و شیر", price:"۵۵٬۰۰۰", emoji:"🫖"},
    ]
  },
  {
    id:"cold", title:"نوشیدنی سرد", icon:"🧊",
    items:[
      {name:"آیس آمریکانو", desc:"قهوه سرد با یخ", price:"۶۰٬۰۰۰", emoji:"🧋"},
      {name:"فراپه کارامل", desc:"قهوه یخی با کارامل و خامه", price:"۸۵٬۰۰۰", emoji:"🥤", tag:"new"},
      {name:"موهیتو لیمو", desc:"نوشیدنی خنک با نعنا و لیمو", price:"۷۰٬۰۰۰", emoji:"🍃"},
      {name:"اسموتی توت‌فرنگی", desc:"میوه تازه و یخ", price:"۹۰٬۰۰۰", emoji:"🍓"},
    ]
  },
  {
    id:"food", title:"غذا و میان‌وعده", icon:"🍔",
    items:[
      {name:"برگر کلاسیک", desc:"گوشت دست‌ساز، پنیر و سس مخصوص", price:"۱۸۰٬۰۰۰", emoji:"🍔", tag:"hot"},
      {name:"سیب‌زمینی سرخ‌کرده", desc:"با سس چدار", price:"۹۵٬۰۰۰", emoji:"🍟"},
      {name:"پاستا آلفردو", desc:"سس خامه‌ای و قارچ", price:"۱۶۵٬۰۰۰", emoji:"🍝"},
      {name:"سالاد سزار", desc:"کاهو، مرغ گریل و سس سزار", price:"۱۴۰٬۰۰۰", emoji:"🥗"},
    ]
  },
  {
    id:"dessert", title:"دسر و شیرینی", icon:"🍰",
    items:[
      {name:"چیزکیک", desc:"با سس توت تازه", price:"۱۱۰٬۰۰۰", emoji:"🍰", tag:"special"},
      {name:"براونی شکلاتی", desc:"همراه با بستنی وانیلی", price:"۱۲۰٬۰۰۰", emoji:"🍫"},
      {name:"کروسان", desc:"خامه‌ای و کره‌ای", price:"۷۵٬۰۰۰", emoji:"🥐"},
      {name:"بستنی سنتی", desc:"زعفرانی با پسته", price:"۸۵٬۰۰۰", emoji:"🍨"},
    ]
  },
];

const CURRENCY = "تومان";

/* ---------- رندر منو ---------- */
const navEl = document.getElementById('nav');
const menuEl = document.getElementById('menu');

MENU.forEach((cat,i)=>{
  // دکمه ناوبری
  const btn = document.createElement('button');
  btn.className = 'nav-btn'+(i===0?' active':'');
  btn.dataset.target = cat.id;
  btn.innerHTML = `<span class="ico">${cat.icon}</span><span>${cat.title}</span>`;
  navEl.appendChild(btn);

  // بخش دسته
  const sec = document.createElement('section');
  sec.className = 'category';
  sec.id = cat.id;
  let itemsHtml = '';
  cat.items.forEach(it=>{
    const tag = it.tag ? `<span class="tag ${it.tag}">${it.tag==='new'?'جدید':it.tag==='hot'?'پرطرفدار':'ویژه'}</span>` : '';
    itemsHtml += `
      <article class="item">
        ${tag}
        <div class="item-emoji">${it.emoji||'🍽️'}</div>
        <div class="item-info">
          <div class="item-name">${it.name}</div>
          <div class="item-desc">${it.desc||''}</div>
        </div>
        <div class="item-price"><span class="num">${it.price}</span><span class="unit">${CURRENCY}</span></div>
      </article>`;
  });
  sec.innerHTML = `
    <div class="cat-head">
      <div class="cat-ico">${cat.icon}</div>
      <h2>${cat.title}</h2>
      <div class="line"></div>
    </div>
    ${itemsHtml}`;
  menuEl.appendChild(sec);
});

/* ---------- ناوبری: اسکرول نرم + فعال‌سازی ---------- */
const navBtns = [...document.querySelectorAll('.nav-btn')];
navBtns.forEach(b=>{
  b.addEventListener('click',()=>{
    const t = document.getElementById(b.dataset.target);
    t.scrollIntoView({behavior:'smooth',block:'start'});
  });
});

/* ---------- ظاهر شدن آیتم‌ها هنگام اسکرول ---------- */
const items = document.querySelectorAll('.item');
const io = new IntersectionObserver((entries)=>{
  entries.forEach((e,idx)=>{
    if(e.isIntersecting){
      e.target.style.animationDelay = (Math.random()*0.15).toFixed(2)+'s';
      e.target.classList.add('show');
      io.unobserve(e.target);
    }
  });
},{threshold:0.15});
items.forEach(it=>io.observe(it));

/* ---------- فعال‌سازی دکمه ناوبری بر اساس بخش دیده‌شده ---------- */
const sections = MENU.map(c=>document.getElementById(c.id));
const spy = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      navBtns.forEach(b=>b.classList.toggle('active', b.dataset.target===e.target.id));
    }
  });
},{rootMargin:'-40% 0px -55% 0px'});
sections.forEach(s=>spy.observe(s));

/* ---------- ذرات شناور ---------- */
const pc = document.getElementById('particles');
for(let i=0;i<16;i++){
  const p = document.createElement('div');
  p.className='particle';
  const size = 6+Math.random()*16;
  p.style.width=size+'px';p.style.height=size+'px';
  p.style.left=Math.random()*100+'%';
  p.style.animationDuration=(10+Math.random()*14)+'s';
  p.style.animationDelay=(-Math.random()*16)+'s';
  pc.appendChild(p);
}

/* ---------- کد QR ---------- */
const qrModal = document.getElementById('qrModal');
const qrBox = document.getElementById('qrcode');
const qrUrlEl = document.getElementById('qrUrl');
const pageUrl = location.href.split('#')[0];

function buildQR(){
  qrBox.innerHTML='';
  // ساخت QR از طریق سرویس تصویری (نیاز به اینترنت هنگام نمایش)
  const img = new Image();
  img.width=240;img.height=240;img.alt='کد QR منو';
  img.src='https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=8&data='+encodeURIComponent(pageUrl);
  img.onerror=()=>{ qrBox.innerHTML='<div style="padding:30px;color:#6b5544">برای ساخت کد QR به اینترنت متصل شوید</div>'; };
  qrBox.appendChild(img);
  qrUrlEl.textContent = pageUrl;
}

document.getElementById('qrFab').addEventListener('click',()=>{
  buildQR();
  qrModal.classList.add('open');
});
document.getElementById('btnClose').addEventListener('click',()=>qrModal.classList.remove('open'));
qrModal.addEventListener('click',(e)=>{ if(e.target===qrModal) qrModal.classList.remove('open'); });
document.getElementById('btnCopy').addEventListener('click',async()=>{
  try{ await navigator.clipboard.writeText(pageUrl);
    const b=document.getElementById('btnCopy'); const o=b.textContent; b.textContent='✓ کپی شد'; setTimeout(()=>b.textContent=o,1500);
  }catch(_){ alert(pageUrl); }
});
</script>
